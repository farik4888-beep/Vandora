const icon = (n, c = '') => (ICONS[n] || '').replace('<svg ', `<svg class="ic ${c}" `);
function sellerStats(id) {
  const rv = DB.reviews.filter((r) => r.targetId === id && !r.hidden);
  return { rating: rv.length ? Math.round(rv.reduce((s, r) => s + r.rating, 0) / rv.length * 10) / 10 : null, reviews: rv.length, deals: DB.orders.filter((o) => o.sellerId === id && o.status === 'COMPLETED').length };
}
const stars = (v) => v == null ? '' : `<span class="text-amber-400">${'★'.repeat(Math.round(v))}<span class="text-navy-100">${'★'.repeat(5 - Math.round(v))}</span></span>`;
function notify(userId, title, body, link) { DB.notifs.unshift({ id: uid(), userId, title, body, link, t: now(), read: false }); }

/** Compress photos on device: max 1000px, JPEG ~0.72 — strips EXIF/GPS, saves localStorage. */
function compress(file) {
  return new Promise((ok, fail) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return fail(new Error('Только JPG, PNG или WEBP'));
    const img = new Image(); img.onerror = () => fail(new Error('Файл не является изображением'));
    img.onload = () => { const s = Math.min(1, 1000 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.72)); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(file);
  });
}

function parseSmart(q) {
  const s = q.toLowerCase(), f = { q: '' };
  const max = s.match(/(?:до|under|below|gacha|<)\s*\$?\s*(\d[\d\s]*)/); if (max) f.max = +max[1].replace(/\s/g, '');
  const min = s.match(/(?:от|from|over|dan)\s*\$?\s*(\d[\d\s]*)/); if (min) f.min = +min[1].replace(/\s/g, '');
  if (/рядом|near|yaqin|поблизости/.test(s)) f.near = 1;
  if (/нов|new|yangi/.test(s)) f.cond = 'NEW'; if (/б\/у|бу |used|ишлатилган|ishlatilgan/.test(s)) f.cond = 'USED';
  const map = { phones: /телефон|смартфон|iphone|phone|samsung|telefon/, computers: /ноутбук|компьютер|laptop|macbook|pc/, cars: /авто|машин|car|avto/, shoes: /обув|кроссов|sneaker|shoe/, furniture: /мебел|диван|sofa|стол/, electronics: /часы|watch|наушник|электрон/, sports: /велосипед|спорт|bike|sport/, 'real-estate': /квартир|дом|apartment/ };
  for (const [c, r] of Object.entries(map)) if (r.test(s)) { f.cat = c; break; }
  const words = s.replace(/(до|от|under|from|рядом со мной|рядом|near me|near|\$|\d+|хороший|хорошую|good|найди|найти|find|мне|me|я|новый|б\/у|used|new)/g, ' ').split(/\s+/).filter((w) => w.length > 2);
  if (!f.cat) f.q = words.slice(0, 3).join(' ');
  else { const brand = s.match(/iphone|samsung|macbook|nike|apple|chevrolet/); if (brand) f.q = brand[0]; }
  return f;
}

function search(p) {
  let r = DB.listings.filter((l) => l.status === 'ACTIVE');
  if (p.q) { const terms = p.q.toLowerCase().split(/\s+/).filter(Boolean); r = r.filter((l) => terms.every((w) => (l.title + ' ' + l.desc).toLowerCase().includes(w))); }
  if (p.cat) r = r.filter((l) => l.cat === p.cat);
  if (p.min) r = r.filter((l) => l.price >= +p.min); if (p.max) r = r.filter((l) => l.price <= +p.max);
  if (p.cond) r = r.filter((l) => l.cond === p.cond);
  if (p.city) r = r.filter((l) => l.city.toLowerCase() === p.city.toLowerCase());
  if (p.seller) r = r.filter((l) => l.sellerId === p.seller);
  if (p.rating) r = r.filter((l) => (sellerStats(l.sellerId).rating ?? 0) >= +p.rating);
  if (p.lat) { r = r.map((l) => ({ ...l, dist: l.lat ? Math.round(km(+p.lat, +p.lng, round(l.lat), round(l.lng)) * 10) / 10 : 1e9 })).filter((l) => l.dist <= +(p.radius || 10)); }
  const s = p.sort || (p.lat ? 'dist' : 'new');
  r.sort(s === 'asc' ? (a, b) => a.price - b.price : s === 'desc' ? (a, b) => b.price - a.price : s === 'pop' ? (a, b) => b.views - a.views : s === 'dist' ? (a, b) => a.dist - b.dist : (a, b) => (b.promoted - a.promoted) || b.createdAt - a.createdAt);
  return r;
}

// ---------------- router ----------------
function parse() {
  const [path, q] = location.hash.slice(1).split('?'); const parts = (path || '/').split('/').filter(Boolean);
  return { name: parts[0] || 'home', arg: parts[1], params: Object.fromEntries(new URLSearchParams(q || '')) };
}
function render() {
  const r = parse(), u = me();
  if (u?.blocked) { DB.session = null; save(); toast('Аккаунт заблокирован', 'err'); }
  renderShell();
  const page = PAGES[r.name];
  $('#app').innerHTML = page ? page(r.params, r.arg) : `<div class="container-v py-24 text-center"><p class="font-display text-7xl font-extrabold text-gradient">404</p><a href="#/" class="btn-primary mt-6">VENDORA</a></div>`;
  if (r.name === 'sell') drawImgs();
  if (r.name === 'item') { const l = listing(r.arg); if (l && DB.settings.currency !== l.currency) convert(l.price, l.currency, DB.settings.currency).then((v) => { const el = $('#conv'); if (el && v != null) el.textContent = `≈ ${money(v, DB.settings.currency)} · курс ${DB.rates.src}`; }); }
  if (r.name === 'messages' && r.arg) { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
  document.title = r.name === 'item' && listing(r.arg) ? `${listing(r.arg).title} · VENDORA` : 'VENDORA — BUY SMART. SELL ANYWHERE.';
  
}

const FORMS = {

  async register(f) {
    const d = Object.fromEntries(new FormData(f)), err = (m) => { $('#err').innerHTML = notice(m, 1); $('#err').scrollIntoView({ block: 'center', behavior: 'smooth' }); toast(m, 'err'); };
    if (d.vd_hp) return err('Проверка на робота не пройдена');
    const NAME = /^[\p{L}][\p{L}\p{M}' -]{0,49}$/u;
    if (!NAME.test(d.firstName.trim()) || !NAME.test(d.lastName.trim())) return err('Укажите имя и фамилию (только буквы)');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) return err('Некорректный email');
    const bad = PW_RULES.filter(([, r]) => !r(d.password)).map(([l]) => l); if (bad.length) return err('Пароль слишком простой: нужно ' + bad.join(', '));
    if (d.password !== d.password2) return err('Пароли не совпадают');
    if (!d.human) return err('Подтвердите, что вы не робот');
    const email = d.email.trim().toLowerCase();
    if (DB.users.some((u) => u.email === email)) return err('Аккаунт с таким email уже есть');
    const salt = uid() + uid(), first = !DB.users.length, algo = HAS_SUBTLE ? 'web' : 'js';
    const u = { id: uid(), firstName: d.firstName.trim(), lastName: d.lastName.trim(), email, salt, algo, passHash: await hashPw(d.password, salt, algo), role: first ? 'ADMIN' : 'USER', createdAt: now(), city: DB.settings.city || 'Tashkent', sub: { status: 'TRIALING', trialEnds: now() + 7 * 864e5 }, fails: 0 };
    DB.users.push(u); DB.session = u.id;
    notify(u.id, 'Добро пожаловать в VENDORA!', 'Seller Pro активен бесплатно 7 дней. Карта не нужна.', '#/pro');
    if (first) notify(u.id, 'Вы — администратор', 'Первый аккаунт в этом браузере получает доступ к админ-панели.', '#/admin');
    save(); toast('Аккаунт создан'); go('#/account');
  },
  async login(f) {
    const email = f.email.value.trim().toLowerCase(), u = DB.users.find((x) => x.email === email), err = (m) => { $('#err').innerHTML = notice(m, 1); toast(m, 'err'); };
    if (!u || !u.passHash) { await hashPw(f.password.value, 'x'); return err('Неверный email или пароль'); }
    if (u.lockedUntil > now()) return err('Слишком много попыток. Попробуйте через ' + Math.ceil((u.lockedUntil - now()) / 6e4) + ' мин.');
    if (await hashPw(f.password.value, u.salt, u.algo || 'web') !== u.passHash) { u.fails = (u.fails || 0) + 1; if (u.fails >= 5) { u.lockedUntil = now() + 15 * 6e4; u.fails = 0; } save(); return err('Неверный email или пароль'); }
    if (u.blocked) return err('Аккаунт заблокирован');
    u.fails = 0; DB.session = u.id; save(); toast('С возвращением, ' + u.firstName);
    const next = f.dataset.next; go(next && next.startsWith('#/') ? next : '#/');

  async changePw(f) {

  store(f) { me().store = { name: f.name.value.trim(), desc: f.desc.value.trim(), color: f.color.value }; save(); toast('Магазин сохранён'); },
  sell(f, e) {
    const d = new FormData(f), draft = e.submitter?.name === 'draft', id = f.dataset.id, errs = [];
    const title = d.get('title').trim(), desc = d.get('desc').trim(), price = +String(d.get('price')).replace(',', '.'), delivery = d.getAll('delivery');
    if (title.length < 3) errs.push('название (мин. 3 символа)'); if (desc.length < 10) errs.push('описание (мин. 10 символов)');
    if (!(price >= 0) || d.get('price') === '') errs.push('цену'); if (!d.get('cat')) errs.push('категорию'); if (!SELL_IMAGES.length) errs.push('хотя бы одно фото'); if (!delivery.length) errs.push('способ получения');
    if (errs.length) return toast('Заполните: ' + errs.join(', '), 'err');
    const city = d.get('city'), lat = +d.get('lat') || CITIES[city][0] + (Math.random() - .5) * .04, lng = +d.get('lng') || CITIES[city][1] + (Math.random() - .5) * .04;
    const data = { title, desc, price, currency: d.get('currency'), cat: d.get('cat'), cond: d.get('cond'), city, country: 'UZ', area: d.get('area').trim(), addressExact: d.get('addressExact').trim(), lat, lng, hideExact: !!d.get('hideExact'), delivery, fee: d.get('fee') ? +d.get('fee') : null, days: d.get('days') ? +d.get('days') : null, images: [...SELL_IMAGES] };
    if (id) {
      const l = listing(id), old = l.price; Object.assign(l, data);
      if (price !== old) { l.priceHistory.push({ p: price, t: now() }); if (price < old) Object.entries(DB.favs).forEach(([uidd, arr]) => arr.includes(id) && notify(uidd, 'Цена снижена', `«${title}» теперь ${money(price, l.currency)}`, '#/item/' + id)); }
      if (save()) { toast('Сохранено'); go('#/account/listings'); }
    } else {
      if (!draft && !canPublish()) return;
      const l = { id: uid(), sellerId: DB.session, ...data, status: draft ? 'DRAFT' : 'ACTIVE', views: 0, favCount: 0, createdAt: now(), priceHistory: [{ p: price, t: now() }], promoted: false };
      DB.listings.unshift(l);
      if (save()) { toast(draft ? 'Черновик сохранён' : 'Объявление опубликовано'); go(draft ? '#/account/listings' : '#/item/' + l.id); } else DB.listings.shift();
    }
  },
  ask(f) { if (!requireAuth()) return; const l = listing(f.dataset.id); DB.questions.push({ id: uid(), listingId: l.id, authorId: DB.session, text: f.text.value.trim(), t: now() }); notify(l.sellerId, 'Новый вопрос', f.text.value.slice(0, 100), '#/item/' + l.id); save(); render(); },
  answer(f) { const q = DB.questions.find((x) => x.id === f.dataset.id); q.answer = f.text.value.trim(); notify(q.authorId, 'Продавец ответил', q.answer.slice(0, 100), '#/item/' + q.listingId); save(); render(); },
  msg(f) { const v = f.text.value.trim(); if (!v) return; sendMsg(f.dataset.id, { text: v }); save(); render(); setTimeout(() => $('form[data-form=msg] input[name=text]')?.focus(), 0); },
  offer(f) {
    const amount = +f.amount.value.replace(',', '.'); if (!(amount > 0)) return toast('Введите сумму', 'err');
    const c = DB.convs.find((x) => x.id === f.dataset.id), l = listing(c.listingId);
    DB.offers.filter((o) => o.convId === c.id && o.status === 'PENDING').forEach((o) => (o.status = 'WITHDRAWN'));
    const o = { id: uid(), convId: c.id, listingId: l.id, buyerId: DB.session, amount, status: 'PENDING', t: now() }; DB.offers.push(o);
    sendMsg(c.id, { text: `💰 Предложение цены: ${money(amount, l.currency)}`, offerId: o.id }); notify(c.sellerId, 'Новое предложение цены', `${money(amount, l.currency)} — ${l.title}`, '#/messages/' + c.id);
    save(); closeModal(); render();
  },
  order(f) {
    const l = listing(f.dataset.id), method = f.method.value, addr = f.address.value.trim();
    if (method !== 'BUYER_PICKUP' && !addr) return toast('Укажите адрес доставки', 'err');
    const offer = DB.offers.filter((o) => o.listingId === l.id && o.buyerId === DB.session && o.status === 'ACCEPTED').pop();
    const price = offer ? offer.amount : l.price, fee = method !== 'BUYER_PICKUP' ? (l.fee || 0) : 0;
    const o = { id: uid(), number: 'VD' + new Date().toISOString().slice(2, 7).replace('-', '') + '-' + Math.floor(1e5 + Math.random() * 9e5), buyerId: DB.session, sellerId: l.sellerId, listingId: l.id, price, fee, total: price + fee, currency: l.currency, method, address: addr, status: 'PENDING', t: now(), events: [{ s: 'PENDING', t: now(), by: 'buyer' }] };
    DB.orders.push(o); if (DB.cart[DB.session]) delete DB.cart[DB.session][l.id];
    notify(l.sellerId, 'Новый заказ', `${o.number}: ${l.title}`, '#/order/' + o.id); save(); closeModal(); go('#/order/' + o.id);
  },
  ship(f) { closeModal(); const o = DB.orders.find((x) => x.id === f.dataset.id); o.track = f.track.value.trim(); orderMove(o.id, 'SHIPPED', o.track ? 'Трек-номер: ' + o.track : ''); },
  dispute(f) { closeModal(); const o = DB.orders.find((x) => x.id === f.dataset.id); o.dispute = f.reason.value.trim(); orderMove(o.id, 'DISPUTED', o.dispute.slice(0, 100)); },
  review(f) {
    const o = DB.orders.find((x) => x.id === f.dataset.id);
    if (o.buyerId !== DB.session || o.status !== 'COMPLETED' || DB.reviews.some((r) => r.orderId === o.id)) return toast('Отзыв недоступен', 'err');
    DB.reviews.push({ id: uid(), orderId: o.id, authorId: DB.session, targetId: o.sellerId, rating: +f.rating.value, text: f.text.value.trim(), t: now() });
    notify(o.sellerId, 'Новый отзыв', '★'.repeat(+f.rating.value), '#/u/' + o.sellerId); save(); toast('Спасибо за отзыв!'); render();
  },
  report(f) { DB.reports.push({ id: uid(), listingId: f.dataset.id, reason: f.reason.value + (f.details.value ? ': ' + f.details.value.trim() : ''), by: DB.session, t: now(), status: 'OPEN' }); save(); closeModal(); toast('Жалоба отправлена модераторам'); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act] && el.tagName !== 'SELECT' && el.tagName !== 'INPUT') { try { const r = ACT[el.dataset.act](el, e); if (r?.catch) r.catch((er) => toast('Ошибка: ' + er.message, 'err')); } catch (er) { console.error(er); toast('Ошибка: ' + er.message, 'err'); } }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = e.submitter || f.querySelector('button:not([type=button])'), label = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="inline-block h-4 w-4 rounded-full border-2 border-current border-t-transparent animate-spin"></span>'; }
  Promise.resolve().then(() => FORMS[f.dataset.form]?.(f, e))
    .catch((er) => { console.error(er); toast('Ошибка: ' + (er?.message || er), 'err'); })
    .finally(() => { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; } });
});
window.addEventListener('error', (e) => toast('Ошибка: ' + e.message, 'err'));
window.addEventListener('unhandledrejection', (e) => toast('Ошибка: ' + (e.reason?.message || e.reason), 'err'));
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.id === 'fileIn') {
    for (const file of [...el.files].slice(0, 15 - SELL_IMAGES.length)) { try { SELL_IMAGES.push(await compress(file)); } catch (er) { toast(er.message, 'err'); } }
    el.value = ''; drawImgs();
  }
  const a = el.dataset.act;
  if (a === 'sort') { const p = parse().params; p.sort = el.value; delete p.page; go('#/search?' + new URLSearchParams(p)); }
  if (a === 'setLang') { DB.settings.lang = el.value; save(); closeModal(); render(); }
  if (a === 'setCur') { DB.settings.currency = el.value; save(); closeModal(); render(); }
  if (a === 'radius') { const p = parse().params; go(`#/map?lat=${p.lat || ''}&lng=${p.lng || ''}&radius=${el.value}`); }
  if (a === 'avatar' && el.files[0]) { try { me().avatar = await compress(el.files[0]); save(); render(); } catch (er) { toast(er.message, 'err'); } }
  if (a === 'msgImg' && el.files[0]) { try { sendMsg(el.dataset.id, { img: await compress(el.files[0]) }); save(); render(); } catch (er) { toast(er.message, 'err'); } }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'pwMeter') $('#pwm').innerHTML = PW_RULES.map(([l, r]) => `<span class="${r(e.target.value) ? 'text-emerald-600' : 'text-navy-900/45'}">${r(e.target.value) ? '✓' : '✕'} ${l}</span>`).join('');
  if (e.target.dataset.act === 'radius') $('#rv').textContent = e.target.value;
});

if (!location.hash) location.hash = '#/';
render();
</script>
</body>
</html>
